name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Validate Manifest & Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate manifest.json format
        run: jq . manifest.json > /dev/null

      - name: Check manifest version matches CHANGELOG.md
        run: |
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          CHANGELOG_VERSION=$(grep -m 1 -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

          if [ "$MANIFEST_VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "Error: manifest.json version ($MANIFEST_VERSION) does not match CHANGELOG.md version ($CHANGELOG_VERSION)"
            exit 1
          fi
          echo "Version match confirmed: $MANIFEST_VERSION"

  build-check:
    name: ShellCheck & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ShellCheck on build.sh
        run: shellcheck build.sh

      - name: Execute build.sh
        run: bash build.sh

      - name: Verify build zip contents
        run: |
          shopt -s nullglob
          ZIPS=(dist/*.zip)

          if [ "${#ZIPS[@]}" -ne 2 ]; then
            echo "Error: expected 2 zips (Chromium and Firefox), found ${#ZIPS[@]}"
            exit 1
          fi

          for ZIP_FILE in "${ZIPS[@]}"; do
            echo "Checking contents of $ZIP_FILE..."
            ZIP_CONTENTS=$(unzip -l "$ZIP_FILE")

            for file in manifest.json LICENSE; do
              if ! echo "$ZIP_CONTENTS" | grep -q "$file"; then
                echo "Error: Missing required file '$file' in $ZIP_FILE"
                exit 1
              fi
            done
          done

          # Only the Firefox zip carries the add-on id.
          for ZIP_FILE in "${ZIPS[@]}"; do
            HAS_GECKO=$(unzip -p "$ZIP_FILE" manifest.json | jq 'has("browser_specific_settings")')
            case "$ZIP_FILE" in
              *-firefox.zip) test "$HAS_GECKO" = "true" ;;
              *) test "$HAS_GECKO" = "false" ;;
            esac
          done
          echo "All required files present in the zip archives."

      - name: Lint the Firefox package
        run: |
          mkdir firefox-package
          unzip -q dist/*-firefox.zip -d firefox-package
          npx --yes web-ext@latest lint --source-dir firefox-package --warnings-as-errors

  # The check that the branch protection requires. It runs even when a job
  # fails, and fails with it: a skipped job would count as a success.
  ci:
    name: ci
    needs: [validate-manifest, build-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
