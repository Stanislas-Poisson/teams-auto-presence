<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Teams Auto Presence - Options</title>
    <style>
      :root {
        --bg: #0d0e12;
        --card: #161822;
        --border: #262a38;
        --text: #e4e6eb;
        --muted: #8b8f9c;
        --accent: #6264a7;
        --accent-hover: #7477bd;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        background: radial-gradient(circle at top, #14161d, var(--bg) 60%);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 2.5rem 1rem;
      }
      .page {
        width: 100%;
        max-width: 42rem;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .header img {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }
      .header h1 {
        font-size: 1.05rem;
        margin: 0;
      }
      .header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        margin-bottom: 1.1rem;
      }
      .card h2 {
        font-size: 0.9rem;
        margin: 0 0 0.9rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .field {
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--border);
      }
      .field:last-of-type {
        border-bottom: none;
        padding-bottom: 0.2rem;
      }
      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .field .title {
        font-size: 0.9rem;
      }
      .hint {
        color: var(--muted);
        font-size: 0.78rem;
        margin-top: 0.3rem;
        line-height: 1.4;
      }
      input[type="time"],
      select {
        font: inherit;
        padding: 0.4rem 0.6rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0f1015;
        color: var(--text);
      }
      input[type="time"]:focus,
      select:focus {
        outline: none;
        border-color: var(--accent);
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 0.2rem;
      }
      button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.45rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent-hover);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
        color: #fff;
      }
      #status {
        color: #37d67a;
        font-size: 0.82rem;
      }
      #error {
        color: #f2634b;
        font-size: 0.82rem;
        margin-top: 0.6rem;
      }
      footer {
        margin-top: 1.75rem;
        padding-top: 1.1rem;
        border-top: 1px solid var(--border);
      }
      footer .made-by {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 0 0 0.6rem;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .pills a {
        --pill: var(--accent);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.76rem;
        padding: 0.3rem 0.75rem 0.3rem 0.55rem;
        border-radius: 999px;
        text-decoration: none;
        border: 1px solid color-mix(in srgb, var(--pill) 35%, var(--border));
        background: color-mix(in srgb, var(--pill) 10%, transparent);
        color: color-mix(in srgb, var(--pill) 70%, white);
        transition: all 0.15s ease;
      }
      .pills a svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
        flex-shrink: 0;
      }
      .pills a:hover {
        color: #fff;
        background: var(--pill);
        border-color: var(--pill);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <img src="icons/icon48.png" alt="" />
        <div>
          <h1>Options</h1>
          <p>Teams Auto Presence</p>
        </div>
      </div>

      <div class="card">
        <h2>Schedule</h2>

        <div class="field">
          <div class="field-row">
            <label class="title" for="workStart">Start of day</label>
            <input type="time" id="workStart" />
          </div>
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="lunchStart">Lunch break start</label>
            <input type="time" id="lunchStart" />
          </div>
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="lunchEnd">Lunch break end</label>
            <input type="time" id="lunchEnd" />
          </div>
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="workEnd">End of day</label>
            <input type="time" id="workEnd" />
          </div>
          <div class="hint">The 4 times must be in chronological order.</div>
        </div>
      </div>

      <div class="card">
        <h2>Statuses</h2>

        <div class="field">
          <div class="field-row">
            <label class="title" for="statusDuringWork">During work</label>
            <select id="statusDuringWork"></select>
          </div>
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="statusDuringLunch">During lunch break</label>
            <select id="statusDuringLunch"></select>
          </div>
        </div>
        <div class="field">
          <div class="field-row">
            <label class="title" for="statusAfterWork">Outside hours / weekend</label>
            <select id="statusAfterWork"></select>
          </div>
          <div class="hint">Applied before the start of day, after the end of day, and all day on Saturday/Sunday.</div>
        </div>
      </div>

      <div class="actions">
        <button id="save" class="primary">Save</button>
        <button id="reset">Reset to defaults</button>
        <span id="status"></span>
      </div>
      <div id="error"></div>

      <footer>
