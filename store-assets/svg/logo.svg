<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Teams Auto Presence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D6FB8"/>
      <stop offset="1" stop-color="#3F4079"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- Clock ring: one arc per slot of the day (work, lunch, work, outside hours) -->
  <g>
    <circle cx="58" cy="62" r="31" fill="none" stroke="#E8566F" stroke-width="12.5" stroke-linecap="round" stroke-dasharray="54.93 139.85" stroke-dashoffset="-1.75" transform="rotate(-163 58 62)"/>
    <circle cx="58" cy="62" r="31" fill="none" stroke="#FFB454" stroke-width="12.5" stroke-linecap="round" stroke-dasharray="23.76 171.02" stroke-dashoffset="-60.19" transform="rotate(-163 58 62)"/>
    <circle cx="58" cy="62" r="31" fill="none" stroke="#E8566F" stroke-width="12.5" stroke-linecap="round" stroke-dasharray="54.93 139.85" stroke-dashoffset="-87.46" transform="rotate(-163 58 62)"/>
    <circle cx="58" cy="62" r="31" fill="none" stroke="#C9C8E6" stroke-width="12.5" stroke-linecap="round" stroke-dasharray="47.14 147.64" stroke-dashoffset="-145.89" transform="rotate(-163 58 62)"/>
  </g>
  <!-- Hands at ten past ten -->
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="58" y1="62" x2="47.0" y2="49.0"/>
    <line x1="58" y1="62" x2="75.0" y2="52.0"/>
  </g>
  <circle cx="58" cy="62" r="4.5" fill="#FFFFFF"/>
  <!-- Presence badge -->
  <circle cx="95" cy="96" r="21" fill="#3F4079"/>
  <circle cx="95" cy="96" r="15" fill="#3DDC84"/>
  <path d="M88.5 96.5l4.6 4.6 8.6-9.4" fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
